<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inscripción recibida · Comité al Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F1;--ink:#1C2629;--muted:#56666A;--accent:#1E5F74;--signal:#E3A62A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141B1D;--ink:#E6EEEC;--muted:#9DB0AE;--accent:#5FB0C9;--signal:#F0BE52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141B1D;--ink:#E6EEEC;--muted:#9DB0AE;--accent:#5FB0C9;--signal:#F0BE52;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:1.0625rem/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:38rem;margin:0 auto;padding:4rem 1.25rem}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2rem,6vw,2.8rem);line-height:1.1;margin:0 0 1rem;padding-left:1rem;border-left:5px solid var(--signal)}
p{color:var(--muted)}
a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Listo, quedaste inscrito</h1>
  <p>Te escribiremos al correo que dejaste cuando el kit esté disponible, con el precio de lanzamiento reservado para ti.</p>
  <p>Mientras tanto, la calculadora sigue disponible cuando la necesites.</p>
  <p><a href="/">Volver a la calculadora</a></p>
</main>
</body>
</html>
